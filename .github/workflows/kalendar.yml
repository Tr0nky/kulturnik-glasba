# Hourly: build the Underground calendar and publish it on GitHub Pages.
# A failed download fails the run before deploy, so the last good calendar stays online.
name: Kalendar
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Kulturnik sometimes answers 502 for a moment, so retry once
      - run: |
          mkdir site
          dotnet run app.cs -- --ics site/underground.ics || { sleep 60; dotnet run app.cs -- --ics site/underground.ics; }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
